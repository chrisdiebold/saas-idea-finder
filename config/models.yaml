# Which provider and model handles each task. See PLAN.md §2 (LLM routing).
# Local tasks run on LM Studio's server (start it with: lms server start).
# The extraction model is chosen by the M2 eval (ideafinder eval report).

providers:
  lmstudio:
    base_url: http://localhost:1234/v1
  anthropic: {}   # needs ANTHROPIC_API_KEY; not used yet
  manual: {}      # copy-paste through claude.ai

tasks:
  extract:          {provider: lmstudio, model: qwen/qwen3.6-35b-a3b}   # provisional until the eval
  embed:            {provider: lmstudio, model: text-embedding-nomic-embed-text-v1.5}
  name_idea:        {provider: lmstudio, model: qwen/qwen3.6-35b-a3b}
  fit_check:        {provider: lmstudio}
  propose_decision: {provider: lmstudio}
  summary:          {provider: lmstudio}
  industry_codes:   {provider: lmstudio}
  lead_opener:      {provider: lmstudio}
  validation_kit:   {provider: lmstudio}
  briefing:         {provider: manual}
