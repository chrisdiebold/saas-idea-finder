# Scoring weights and thresholds. See PLAN.md §3. Weights must sum to 1.0.

weights:
  volume: 0.20
  spread: 0.20
  intensity: 0.10
  payment: 0.15
  momentum: 0.10
  competitive_gap: 0.10
  fit: 0.10
  solo_buildable: 0.05

thread_cap: 5   # max Signals one Thread contributes to an Idea's volume

publish:        # when an Incubating Idea reaches the Inbox
  min_authors: 5
  min_communities: 2
  require_pain_or_request: true

resurface:      # when an archived Idea returns to the Inbox (evidence-based Archive reasons only)
  momentum_multiplier: 3.0
  on_new_community: true

stale:          # when a Briefing is marked Stale
  signal_growth_pct: 50
  on_new_community: true

validation:
  time_limit_days: 14
  active_limit: 3

clustering:     # how Signals become Ideas (PLAN.md §3 step 5); similarities are cosine, 0–1
  # Tuned 2026-11-21 on 1,516 mostly-Jira Signals with nomic-embed-text: members below ~0.92 drift
  # to other problems (everything Jira scores 0.8+), and Related links below ~0.90 were unrelated.
  attach_similarity: 0.92   # a new Signal joins the nearest Idea at or above this; else the pool
  related_similarity: 0.90  # Ideas whose problems (without Persona) are this close are Related
  min_cluster_size: 3       # smallest group of pooled Signals that can form a new Idea
  min_authors: 2            # ...and it needs this many distinct Authors (one person isn't a pattern)

inbox:
  confident_at: 0.8   # Proposed decisions at least this confident are grouped under "Confirm all"
