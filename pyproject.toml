[project]
name = "ideafinder"
version = "0.1.0"
description = "Personal tool that finds and validates SaaS ideas from public evidence on the web"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pgvector>=0.5.1",
    "procrastinate==3.12.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqlalchemy[asyncio]>=2",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ideafinder = "ideafinder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideafinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: needs a running Postgres (skipped if unavailable)"]
filterwarnings = [
    # Starlette's TestClient nudges toward an httpx successor; harmless for our tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
