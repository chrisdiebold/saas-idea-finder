<style>
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden;
                     clip: rect(0 0 0 0); white-space: nowrap; }

  /* One Idea in a list: no box, a left rule that turns green when it's the one you're on. */
  .entry { position: relative; padding: 4px 0 22px 20px; margin: 0 0 22px;
           border-left: 2px solid var(--rule); max-width: 760px; }
  .entry:focus { outline: none; }
  .entry.is-selected { border-left-color: var(--go); }
  .entry header { display: flex; align-items: baseline; gap: 10px; }
  .entry-title { font-size: 18px; font-weight: 600; letter-spacing: -.01em; text-decoration: none;
                 line-height: 1.3; }
  .entry-title:hover { text-decoration: underline; }
  .score { margin-left: auto; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;
           color: var(--muted); }
  .persona { color: var(--ink); margin: 2px 0 8px; }
  .proposal { margin: 12px 0 10px; max-width: 70ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .actions form { display: flex; gap: 6px; align-items: center; margin: 0; }

  /* Clear calls: a compact checklist rather than full entries. */
  .ticklist { list-style: none; padding: 0; margin: 12px 0 16px; max-width: 860px; }
  .ticklist li { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px;
                 padding: 9px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .tick-title { font-weight: 600; }
  .tick-call { font-size: 14px; text-align: right; }
  .tick-why { grid-column: 2 / 4; }
  .confident { margin-bottom: 40px; }

  /* Idea detail: evidence on the left, the numbers in a narrow rail. */
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; }
  .rail h3:first-child { margin-top: 4px; }
  .rail { font-size: 14px; }
  .bars { list-style: none; padding: 0; margin: 0; }
  .bars li { display: grid; grid-template-columns: 112px 1fr 34px; gap: 8px; align-items: center;
             padding: 3px 0; }
  .bar { height: 6px; background: #E7EBE9; border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--ink); }
  .bars .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .trend { width: 100%; height: 48px; }
  .trend polyline { fill: none; stroke: var(--go); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .rail ul.plain { list-style: none; padding: 0; margin: 0; }
  .rail ul.plain li { padding: 4px 0; border-bottom: 1px solid var(--rule); }
  .signal { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 10px;
            padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .signal .voice { margin: 4px 0 2px; font-size: 15.5px; }
  .signal .about { font-size: 13px; color: var(--muted); }
  .split-bar { position: sticky; bottom: 0; background: var(--paper); padding: 12px 0;
               border-top: 1px solid var(--rule); }
  .verdict { font-size: 17px; font-weight: 600; max-width: 64ch; margin: 18px 0 6px; }

  /* Plain lists of Ideas (Working List, Archive) */
  .rows { list-style: none; padding: 0; margin: 0; max-width: 860px; }
  .rows li { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 16px; padding: 12px 0;
             border-bottom: 1px solid var(--rule); align-items: baseline; }
  .rows .sub { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
  .rows .num { font-variant-numeric: tabular-nums; color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; margin-bottom: 18px; }
  .filters a { color: var(--muted); text-decoration: none; }
  .filters a[aria-current="true"] { color: var(--ink); font-weight: 600; }

  @media (max-width: 760px) {
    .detail { grid-template-columns: 1fr; gap: 24px; }
    .ticklist li { grid-template-columns: 22px 1fr; }
    .tick-call { text-align: left; grid-column: 2; }
    .rows li { grid-template-columns: 1fr auto; }
  }
</style>
