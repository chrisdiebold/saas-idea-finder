<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SaaS Idea Finder{% endblock %}</title>
  <style>
    :root { --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --ok: #1a7f37; --bad: #b42318; }
    body { font: 15px/1.5 -apple-system, system-ui, sans-serif; color: var(--fg); max-width: 760px;
           margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
         margin: 32px 0 8px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    td:first-child { color: var(--muted); width: 40%; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    .problems { border: 1px solid var(--bad); border-radius: 8px; padding: 12px 16px; }
    .problems li { margin: 4px 0; }
    code { background: #f2f2f7; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
